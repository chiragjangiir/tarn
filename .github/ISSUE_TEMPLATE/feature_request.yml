name: Feature request
description: Propose a language, std or tooling feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today? Show the code you would write now.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to write instead. Compare with Go/Rust if useful.
    validations:
      required: true
  - type: checkboxes
    id: adr
    attributes:
      label: Language semantics
      options:
        - label: This changes language semantics and will need an ADR in docs/adr/ before implementation.
